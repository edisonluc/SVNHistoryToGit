[workspace]
resolver = "2"
members = [
    "crates/svn-history-to-git-core",
    "crates/svn-history-to-git-cli",
]

[workspace.package]
version = "0.2.0"
authors = ["edisonluc"]
repository = "https://github.com/edisonluc/SVNHistoryToGit"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
gix = { version = "0.68", default-features = false, features = ["max-performance-safe"] }
globset = "0.4"
hex = "0.4"
keyring = { version = "3", features = ["windows-native"] }
quick-xml = "0.37"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes"] }
zstd = "0.13"
